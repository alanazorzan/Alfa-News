
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='15' width='80' height='70' rx='6' fill='%231a3d7c'/%3E%3Crect x='20' y='25' width='30' height='25' rx='2' fill='%23ffffff'/%3E%3Crect x='55' y='25' width='25' height='5' rx='2' fill='%23ffffff'/%3E%3Crect x='55' y='35' width='25' height='5' rx='2' fill='%23ffffff'/%3E%3Crect x='55' y='45' width='25' height='5' rx='2' fill='%23ffffff'/%3E%3Crect x='20' y='58' width='60' height='5' rx='2' fill='%23ffffff'/%3E%3Crect x='20' y='68' width='60' height='5' rx='2' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>AlfaNews</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .jornal-img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }

      footer {
        background-color: #252430;
        color: #fff;
        text-align: center;
        padding: 15px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="jornal.png"
        alt="Jornal Escolar"
        class="jornal-img"
        data-tentativas="0"
        onerror="trocarFormato(this)"
      />
    </div>

    <footer>
      <p>&copy; 2026 AlfaNews - Todos os direitos reservados</p>
    </footer>
    <script>
      function trocarFormato(img) {
        let tentativas = parseInt(img.dataset.tentativas);

        if (tentativas === 0) {
          // 1ª falha: tenta o .jpg
          img.dataset.tentativas = 1;
          img.src = "jornal.jpg";
        } else if (tentativas === 1) {
          // 2ª falha: tenta o .jpeg
          img.dataset.tentativas = 2;
          img.src = "jornal.jpeg";
        } else {
          // Todas falharam: remove o handler para não entrar em loop
          img.onerror = null;
          img.alt =
            "Imagem do jornal não encontrada. Verifique se o arquivo 'jornal.png' ou 'jornal.jpg' está na pasta.";
        }
      }
    </script>
  </body>
</html>
